name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.0.0-beta.14"
  # go.sum is committed; skip the online checksum DB to avoid flaky
  # sum.golang.org stream errors on CI runners.
  GOSUMDB: "off"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build Windows binary
        shell: bash
        env:
          # Inject version metadata via -ldflags -X. VERSION comes from the
          # git tag (stripped of the leading "v"); COMMIT and BUILD_TIME are
          # taken from the workflow context.
          VERSION_LDFLAGS: >-
            -X chemlab/internal/version.Version=${GITHUB_REF_NAME#v}
            -X chemlab/internal/version.Commit=${GITHUB_SHA::8}
            -X chemlab/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        run: wails3 build

      - name: Package NSIS installer (best effort)
        shell: bash
        run: |
          # wails3 package needs the makensis binary; install NSIS via choco.
          if ! command -v makensis >/dev/null 2>&1; then
            "/c/ProgramData/chocolatey/bin/choco.exe" install nsis -y --no-progress >/dev/null 2>&1 || true
            export PATH="$PATH:/c/Program Files (x86)/NSIS"
          fi
          if command -v makensis >/dev/null 2>&1; then
            wails3 package || echo "::warning::NSIS packaging failed; the raw exe will still be uploaded"
          else
            echo "::warning::NSIS not available; skipping installer"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chemlab-windows
          path: |
            bin/chemlab.exe
            bin/*-installer.exe
          if-no-files-found: error

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.exe
          fail_on_unmatched_files: false
          draft: true
