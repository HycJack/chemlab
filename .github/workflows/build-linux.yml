name: Build Linux AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.0.0-beta.14"
  GOSUMDB: "off"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev libnotify-dev pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build Linux binary
        run: wails3 build

      - name: Package AppImage (best effort)
        run: |
          if wails3 package; then
            echo "AppImage packaged"
          else
            echo "::warning::AppImage packaging failed; the raw binary will still be uploaded"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chemlab-linux
          path: |
            bin/chemlab
            bin/*.AppImage
          if-no-files-found: error

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/chemlab
            bin/*.AppImage
          fail_on_unmatched_files: false
          draft: true
